<nav class="mt-6 px-6 min-w-[300px]" aria-label="On this page">
    <!-- A label, not a heading: the nav's aria-label names it, and a heading here would sit in
         every page's outline. -->
    <p class="pc-h6"><small>ON THIS PAGE</small></p>
    @for (item of jumpNav(); track $index) {
    <a  routerLink="." [fragment]="item.value" class="w-[100%] block">{{ item.key }}</a>
    }
</nav>
