<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Pioneer Charts - Angular charts built on D3</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The home page's; the app replaces them per page on navigation (src/app/seo.ts). They're here
       too for crawlers and link previews that don't run JavaScript. -->
  <meta name="description"
    content="Pioneer Charts is an Angular library of bar, line, area, plot, pie, donut, dot plot and proximity charts built on D3 - responsive, themeable and simple to configure.">
  <link rel="canonical" href="https://pioneercharts.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pioneer Charts">
  <meta property="og:title" content="Pioneer Charts - Angular charts built on D3">
  <meta property="og:description"
    content="Pioneer Charts is an Angular library of bar, line, area, plot, pie, donut, dot plot and proximity charts built on D3 - responsive, themeable and simple to configure.">
  <meta property="og:url" content="https://pioneercharts.com/">
  <!-- One preview image for every page; its source is build/og-image.html. -->
  <meta property="og:image" content="https://pioneercharts.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pioneer Charts: Angular charts built on D3, with an area, a bar and a donut chart.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The light or dark theme, set before the first paint so a page never flashes the other one:
       the choice saved by the header's switch, else the system's setting. See ThemeService. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('pc-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.add(dark ? 'pc-dark' : 'pc-light');
      // Inline, too: the page's inlined critical CSS only keeps rules matching the pre-rendered
      // HTML, which has no class yet - so it has `color-scheme: light` but not the dark rule, and
      // the page drew light until the full stylesheet arrived. An inline style outranks it.
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      // The header switch's icon (header.scss), for the same reason.
      document.documentElement.style.setProperty('--pc-theme-icon-moon', dark ? 'none' : 'inline-block');
      document.documentElement.style.setProperty('--pc-theme-icon-sun', dark ? 'inline-block' : 'none');
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="mat-typography">
  <app-root></app-root>
</body>

</html>
