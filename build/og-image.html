<!doctype html>
<!--
  Source of the docs site's link-preview image, projects/pioneer-charts-docs/public/og-image.png
  (the og:image in index.html). 1200x630, the size Open Graph and X's large card expect.

  To change it: edit this page, open it in Chrome, and capture a 1200x630 screenshot of it (DevTools
  > device toolbar at 1200 x 630, then "Capture screenshot"), saved over that file.
  Colors are the site's own: the header's #24282e and the charts' default palette (PcacColorService).
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Pioneer Charts - link preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=block"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: Roboto, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 85% 20%, rgba(163, 161, 251, 0.18), transparent 45%),
        radial-gradient(circle at 70% 95%, rgba(94, 226, 160, 0.12), transparent 40%),
        #24282e;
    }

    .copy {
      position: absolute;
      left: 72px;
      top: 0;
      bottom: 0;
      width: 470px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand svg {
      width: 78px;
      height: 60px;
    }

    .brand svg polygon {
      fill: #fff;
    }

    h1 {
      margin: 0;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    .tagline {
      margin: 0 0 30px;
      font-size: 30px;
      font-weight: 300;
      line-height: 1.3;
      color: #d8dae0;
    }

    .tagline b {
      font-weight: 500;
      color: #fff;
    }

    .types {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .types span {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 17px;
      font-weight: 500;
      color: #e6e7eb;
    }

    .url {
      position: absolute;
      left: 72px;
      bottom: 40px;
      font-size: 20px;
      font-weight: 500;
      color: #5ee2a0;
      letter-spacing: 0.3px;
    }

    .card {
      position: absolute;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .card svg {
      display: block;
    }

    .card-label {
      position: absolute;
      left: 20px;
      top: 14px;
      font-size: 15px;
      font-weight: 500;
      color: #2b2f36;
    }
  </style>
</head>

<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 208.7 161.3" aria-hidden="true">
        <polygon
          points="122.2,7.6 122.5,7.6 200.3,161.2 207.6,161.2 125.9,0.3 118.8,0.3 82.7,71.5 67.8,42.2 60.8,42.2 0.4,161.2 7.7,161.2 64.1,49.5 64.5,49.5 79.2,78.5 37.2,161.2 44.5,161.2 82.7,85.6 98.7,117.2 76.3,161.2 83.6,161.2 102.3,124.3 120.9,161.2 128.2,161.2 105.8,117.2 122.3,84.6 122.7,84.6 161.4,161.2 168.6,161.2 126,77.3 118.9,77.3 102.3,110.2 86.3,78.6" />
      </svg>
      <h1>Pioneer<br>Charts</h1>
    </div>
    <p class="tagline"><b>Angular</b> charts built on <b>D3</b>: responsive, accessible and simple to configure.</p>
    <div class="types">
      <span>Bar</span><span>Line</span><span>Area</span><span>Plot</span><span>Pie</span><span>Donut</span>
    </div>
  </div>
  <div class="url">pioneercharts.com</div>

  <!-- Area / line card: two series over a light grid. -->
  <div class="card" style="left: 600px; top: 58px; width: 530px; height: 250px;">
    <div class="card-label">Weekly visits</div>
    <svg width="530" height="250" viewBox="0 0 530 250">
      <g stroke="#e9ecef" stroke-width="1">
        <line x1="24" x2="506" y1="70" y2="70" />
        <line x1="24" x2="506" y1="115" y2="115" />
        <line x1="24" x2="506" y1="160" y2="160" />
        <line x1="24" x2="506" y1="205" y2="205" />
      </g>
      <path d="M24,160 C84,150 104,110 164,112 C224,114 244,80 304,86 C364,92 384,58 444,62 C474,64 490,70 506,66 L506,220 L24,220 Z"
        fill="#a3a1fb" fill-opacity="0.45" />
      <path d="M24,160 C84,150 104,110 164,112 C224,114 244,80 304,86 C364,92 384,58 444,62 C474,64 490,70 506,66"
        fill="none" stroke="#a3a1fb" stroke-width="3" />
      <path d="M24,196 C84,190 104,170 164,176 C224,182 244,150 304,146 C364,142 384,160 444,132 C474,120 490,124 506,118 L506,220 L24,220 Z"
        fill="#5ee2a0" fill-opacity="0.45" />
      <path d="M24,196 C84,190 104,170 164,176 C224,182 244,150 304,146 C364,142 384,160 444,132 C474,120 490,124 506,118"
        fill="none" stroke="#5ee2a0" stroke-width="3" />
      <g fill="#fff" stroke-width="3">
        <circle cx="164" cy="112" r="5" stroke="#a3a1fb" />
        <circle cx="304" cy="86" r="5" stroke="#a3a1fb" />
        <circle cx="444" cy="62" r="5" stroke="#a3a1fb" />
        <circle cx="164" cy="176" r="5" stroke="#5ee2a0" />
        <circle cx="304" cy="146" r="5" stroke="#5ee2a0" />
        <circle cx="444" cy="132" r="5" stroke="#5ee2a0" />
      </g>
    </svg>
  </div>

  <!-- Grouped bar card, with a threshold across it. -->
  <div class="card" style="left: 600px; top: 330px; width: 300px; height: 240px;">
    <div class="card-label">Sales by product</div>
    <svg width="300" height="240" viewBox="0 0 300 240">
      <g stroke="#e9ecef" stroke-width="1">
        <line x1="20" x2="280" y1="80" y2="80" />
        <line x1="20" x2="280" y1="130" y2="130" />
        <line x1="20" x2="280" y1="180" y2="180" />
      </g>
      <g>
        <rect x="30" y="112" width="18" height="98" fill="#a3a1fb" />
        <rect x="50" y="150" width="18" height="60" fill="#5ee2a0" />
        <rect x="70" y="176" width="18" height="34" fill="#ff6565" />

        <rect x="112" y="150" width="18" height="60" fill="#a3a1fb" />
        <rect x="132" y="168" width="18" height="42" fill="#5ee2a0" />
        <rect x="152" y="192" width="18" height="18" fill="#ff6565" />

        <rect x="194" y="64" width="18" height="146" fill="#a3a1fb" />
        <rect x="214" y="104" width="18" height="106" fill="#5ee2a0" />
        <rect x="234" y="120" width="18" height="90" fill="#ff6565" />
      </g>
      <line x1="20" x2="280" y1="96" y2="96" stroke="#ff2d2d" stroke-width="4" />
      <line x1="20" x2="280" y1="210" y2="210" stroke="#c9ccd1" stroke-width="1.5" />
    </svg>
  </div>

  <!-- Donut card, with its total in the center. -->
  <div class="card" style="left: 920px; top: 330px; width: 210px; height: 240px;">
    <div class="card-label">Share</div>
    <svg width="210" height="240" viewBox="0 0 210 240">
      <g transform="translate(105 136)" fill="none" stroke-width="30">
        <!-- r = 62; circumference ~ 389.6, split 34 / 22 / 18 / 15 / 11 per cent. -->
        <circle r="62" stroke="#a3a1fb" stroke-dasharray="132.5 389.6" transform="rotate(-90)" />
        <circle r="62" stroke="#5ee2a0" stroke-dasharray="85.7 389.6" stroke-dashoffset="-132.5" transform="rotate(-90)" />
        <circle r="62" stroke="#ff6565" stroke-dasharray="70.1 389.6" stroke-dashoffset="-218.2" transform="rotate(-90)" />
        <circle r="62" stroke="#fec163" stroke-dasharray="58.4 389.6" stroke-dashoffset="-288.3" transform="rotate(-90)" />
        <circle r="62" stroke="#ffa177" stroke-dasharray="42.9 389.6" stroke-dashoffset="-346.7" transform="rotate(-90)" />
      </g>
      <text x="105" y="140" text-anchor="middle" font-family="Roboto, sans-serif" font-size="30" font-weight="700"
        fill="#2b2f36">2,708</text>
      <text x="105" y="160" text-anchor="middle" font-family="Roboto, sans-serif" font-size="13" fill="#6c757d">total</text>
    </svg>
  </div>
</body>

</html>
