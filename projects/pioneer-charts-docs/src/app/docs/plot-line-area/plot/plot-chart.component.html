<app-plot-line-area-base [title]="'Plot Chart'" [lead]="'Displays each series as standalone points, with no connecting line or fill.'"
  [markup]="markupCode" [importCode]="importCode" [contract]="pcService.plotConfig.value() | stringify">
  <mat-card class="p-3">
    <app-layout-resource-state [resource]="pcService.plotConfig">
      <pcac-plot-chart [config]="pcService.plotConfig.value()" (dotClicked)="pcService.onClicked($event)" />
    </app-layout-resource-state>
  </mat-card>
  <mat-card class="p-3 mt-3">
    <app-layout-resource-state [resource]="pcService.plotConfig">
      <pcac-plot-chart [config]="pcService.plotConfig.value()" (dotClicked)="pcService.onClicked($event)" />
    </app-layout-resource-state>
  </mat-card>
  <h4 class="mt-6 mb-2">Point images</h4>
  <p class="mb-3">Set <code>image</code> on a data point to draw it in place of the dot, sized by the
    config's <code>pointImage</code> box. Points without an <code>image</code> keep their dot.</p>
  <mat-card class="p-3">
    <app-layout-resource-state [resource]="pcService.plotImagesConfig">
      <pcac-plot-chart [config]="pcService.plotImagesConfig.value()" (dotClicked)="pcService.onClicked($event)" />
    </app-layout-resource-state>
  </mat-card>
</app-plot-line-area-base>
