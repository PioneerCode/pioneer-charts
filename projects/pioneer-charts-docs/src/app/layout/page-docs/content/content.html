<!-- @container: the demo grids inside size their columns to this pane, not the screen (the
     sidebar and "On this page" column take much of a laptop or tablet screen). -->
<div class="@container p-6 pt-4 bg-white w-[100%]">
  <!-- Focused on arriving from another page (content.ts): tabindex="-1" lets script focus it. -->
  <h1 #heading tabindex="-1" class="pc-docs-heading">{{ pageTitle() }}</h1>
  <ng-content />
</div>
