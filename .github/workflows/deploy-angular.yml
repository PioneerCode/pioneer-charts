name: Deploy to GitHub Pages

# Manual docs-only deploy. Releases deploy the docs automatically (see publish.yml's deploy-docs
# job); use this for docs changes that don't warrant a new package version.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write          # required
  id-token: write       # required

# Shared with publish.yml's deploy-docs job, and never cancelled: a manual deploy waits for a
# release's docs deploy to finish rather than cancelling it (and vice versa).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build:lib && npm run build:docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/pioneer-charts-docs/browser  

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4