name: Deploy to GitHub Pages

# Manual docs-only deploy. Releases deploy the docs automatically (see publish.yml's deploy-docs
# job); use this for docs changes that don't warrant a new package version.

on:
  workflow_dispatch:

# Read-only by default: the build job runs `npm ci`, and with it every dependency's install
# scripts, so it gets no more than it needs. Only `deploy` can write to Pages.
permissions:
  contents: read

# Shared with publish.yml's deploy-docs job, and never cancelled: a manual deploy waits for a
# release's docs deploy to finish rather than cancelling it (and vice versa).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build:lib && npm run build:docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist/pioneer-charts-docs/browser  

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write          # to deploy to Pages
      id-token: write       # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5