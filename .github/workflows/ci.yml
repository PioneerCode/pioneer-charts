name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request cancels the run it replaces; on main every merge gets a result
# of its own, so two quick merges don't leave the first with only a cancelled check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # The docs app, its specs included, resolves '@pioneer-code/pioneer-charts' through tsconfig
      # paths to ./dist/pioneer-charts, so the library has to be built before either.
      - name: Build library
        run: npm run build:lib

      # Both projects' specs (see the `test` script)
      - name: Test
        run: npm run test

      - name: Build docs
        run: npm run build:docs

  # The library's peer range starts at Angular 22.1 (projects/pioneer-charts/package.json), while
  # the workspace itself is on a later 22.x - so this job proves the bottom of that range the way a
  # consumer meets it: the package built as it's published (on the workspace's Angular, with the
  # `@angular/build:library` builder, which 22.1 doesn't have), then the docs app - a real consumer
  # of it - tested and built on 22.1.
  angular-min:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build library
        run: npm run build:lib

      # The lockfile is on the workspace's Angular and npm won't mix the two, so it's resolved afresh
      # here, from an empty node_modules (in this job's checkout only; nothing is committed back).
      # ./dist is kept: the docs use the package built above.
      - name: Install Angular 22.1
        run: |
          for p in cdk common compiler core forms material platform-browser platform-server router ssr; do
            npm pkg set "dependencies.@angular/$p=~22.1.0"
          done
          for p in build cli compiler-cli; do
            npm pkg set "devDependencies.@angular/$p=~22.1.0"
          done
          rm -rf node_modules package-lock.json
          npm install
          npx ng version

      - name: Test docs
        run: npx ng test pioneer-charts-docs --watch=false

      - name: Build docs
        run: npm run build:docs
