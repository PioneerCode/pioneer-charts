    <!-- A toggle: one name, its state in aria-pressed - the same in the pre-rendered HTML as once
         the app has started. Both icons are always there and CSS shows the one for the theme (the
         moon on the light theme, the sun on the dark), from custom properties index.html's
         pre-paint script sets inline, so a dark page shows the sun before the app starts too. A
         plain title for the hover hint: MatTooltip would bring Material's overlay code into every
         page's initial bundle. -->
    <button matIconButton type="button" class="theme-toggle" (click)="theme.toggle()" aria-label="Dark theme"
      [attr.aria-pressed]="theme.dark()" title="Dark theme">
      <mat-icon class="pc-theme-icon-moon">dark_mode</mat-icon>
      <mat-icon class="pc-theme-icon-sun">light_mode</mat-icon>
    </button>

  </mat-toolbar-row>
  <!-- Below 960px, docs pages open their sidebar (a drawer) from here: see DocsNavService. On every
       docs page, pre-rendered HTML included, and hidden by CSS from 960px (header.scss) - so a
       phone's first paint already has it, rather than the page jumping when the app adds it. -->
  @if (nav.available()) {
  <mat-toolbar-row class="menu-row">
    <button matButton type="button" [attr.aria-expanded]="nav.opened()" aria-controls="docs-navigation"
      (click)="nav.toggle()">
      <mat-icon>menu</mat-icon>
      Menu
    </button>
  </mat-toolbar-row>
  }
</mat-toolbar>
