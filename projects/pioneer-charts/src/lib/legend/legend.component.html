<div class="pcac-legend-label"><small>{{config().heading}}</small></div>
@for(item of config().items; track item; let i = $index; let first = $first; let last = $last;) {
<div class="pcac-legend-item" [class.pcac-legend-item-last]="last" [class.pcac-legend-unchecked]="!item.checked"
  role="switch" [attr.aria-checked]="item.checked" tabindex="0" (click)="onItemClicked(i)"
  (keydown.enter)="onItemClicked(i)" (keydown.space)="onItemClicked(i); $event.preventDefault()">
  @let color =  item.colorOverride ? item.colorOverride : colorScale()[i];
  <div class="pcac-legend-circle" [style.backgroundColor]="color"></div>
  <small>{{ item.label }}</small>
</div>
}
