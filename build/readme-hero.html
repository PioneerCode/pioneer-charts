<!doctype html>
<!--
  Source of the README's hero image, .github/assets/readme-hero.png: the link-preview image's design
  (og-image.html), widened to a 1280x600 banner with more of the chart types. Captured at 2x so it
  stays sharp on high-density screens; GitHub and npm scale it to the README's width.

  To change it: edit this page, then from the repo root run

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1280,600 --force-device-scale-factor=2 --virtual-time-budget=5000 \
      --screenshot=.github/assets/readme-hero.png "file://$PWD/build/readme-hero.html"

  The README links the image by its raw.githubusercontent.com URL on main, not a relative path, so
  it shows on npm as well as GitHub; a new image appears there once it's merged.
  Colors are the site's own: the header's #24282e and the charts' default palette (PcacColorService).
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Pioneer Charts - README hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=block"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      width: 1280px;
      height: 600px;
      overflow: hidden;
    }

    body {
      position: relative;
      font-family: Roboto, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 80% 15%, rgba(163, 161, 251, 0.18), transparent 45%),
        radial-gradient(circle at 60% 100%, rgba(94, 226, 160, 0.12), transparent 40%),
        #24282e;
    }

    .copy {
      position: absolute;
      left: 64px;
      top: 0;
      bottom: 0;
      width: 440px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand svg {
      width: 78px;
      height: 60px;
    }

    .brand svg polygon {
      fill: #fff;
    }

    h1 {
      margin: 0;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    .tagline {
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 300;
      line-height: 1.3;
      color: #d8dae0;
    }

    .tagline b {
      font-weight: 500;
      color: #fff;
    }

    .types {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .types span {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 17px;
      font-weight: 500;
      color: #e6e7eb;
    }

    .url {
      position: absolute;
      left: 64px;
      bottom: 40px;
      font-size: 20px;
      font-weight: 500;
      color: #5ee2a0;
      letter-spacing: 0.3px;
    }

    .card {
      position: absolute;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .card svg {
      display: block;
    }

    .card-label {
      position: absolute;
      left: 20px;
      top: 14px;
      font-size: 15px;
      font-weight: 500;
      color: #2b2f36;
    }
  </style>
</head>

<body>
  <div class="copy">

</body>

</html>
