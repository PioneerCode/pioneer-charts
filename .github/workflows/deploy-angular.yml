name: Deploy to GitHub Pages

# Manual docs-only deploy. Releases deploy the docs automatically (see publish.yml's deploy-docs
# job); use this for docs changes that don't warrant a new package version.

on:
  workflow_dispatch:

# Read-only by default: the build job runs `npm ci`, and with it every dependency's install
# scripts, so it gets no more than it needs. Only `deploy` can write to Pages.
permissions:
  contents: read

# Shared with publish.yml's deploy-docs job, and never cancelled: a manual deploy waits for a
# release's docs deploy to finish rather than cancelling it (and vice versa).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build:lib && npm run build:docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist/pioneer-charts-docs/browser  

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write          # to deploy to Pages
      id-token: write       # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1